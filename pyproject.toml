[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "camera-color-picker"
version = "0.2.0"
description = "Jupyter tool to test USB cameras, measure colors and HSV ranges, and estimate focal length"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [{name = "ticohannan"}]
requires-python = ">=3.10"
dependencies = ["opencv-python>=4.8", "numpy", "ipywidgets>=8", "ipyevents>=2"]

[project.optional-dependencies]
extras = ["cv2_enumerate_cameras", "imageio-ffmpeg"]
test = ["pytest", "nbclient", "nbformat", "ipykernel"]

[tool.setuptools]
packages = ["camera_color_picker"]
